# The checks in README's Development section, also runnable locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact versions only; there is no moving major tag to follow.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml, rather than quietly
      # resolving something nobody committed. Python comes from .python-version.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q

  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: |
          wheel_dir="$(mktemp -d)"
          trap 'rm -rf "$wheel_dir"' EXIT
          uv build --wheel --out-dir "$wheel_dir"
          uv run --no-project --python "$(cat .python-version)" python tests/wheel_smoke.py "$wheel_dir"/*.whl
