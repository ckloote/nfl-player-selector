[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "nfl-pool"
version = "0.1.0"
description = "Decision support for a season-long NFL touchdown pool"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "pyarrow>=15",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
pool = "pool.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.uv.build-backend]
module-name = "pool"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
